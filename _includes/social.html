{% if site.social.size > 0 %}
<nav class="social{% if include.variant %} social-{{ include.variant }}{% endif %}" aria-label="Social">
  {% for item in site.social %}
    <a href="{{ item.url }}" target="_blank" rel="noopener me" aria-label="DevOps Ranch on {{ item.name | escape }}">
      {% case item.icon %}
        {% when "x" %}
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-4.71-6.23-5.4 6.23H2.74l7.73-8.84L1.25 2.25h6.83l4.25 5.62 5.91-5.62Zm-1.16 17.52h1.83L7.08 4.13H5.12l11.96 15.64Z"/>
          </svg>
        {% when "youtube" %}
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" fill-rule="evenodd" d="M23.5 6.19a3.02 3.02 0 0 0-2.13-2.14C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.37.45A3.02 3.02 0 0 0 .5 6.19 31.7 31.7 0 0 0 0 12a31.7 31.7 0 0 0 .5 5.81 3.02 3.02 0 0 0 2.13 2.14c1.87.45 9.37.45 9.37.45s7.5 0 9.37-.45a3.02 3.02 0 0 0 2.13-2.14A31.7 31.7 0 0 0 24 12a31.7 31.7 0 0 0-.5-5.81ZM9.75 15.57V8.43L15.84 12l-6.09 3.57Z"/>
          </svg>
        {% when "instagram" %}
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" fill-rule="evenodd" d="M7.5 2.75h9a4.75 4.75 0 0 1 4.75 4.75v9a4.75 4.75 0 0 1-4.75 4.75h-9A4.75 4.75 0 0 1 2.75 16.5v-9A4.75 4.75 0 0 1 7.5 2.75Zm4.5 4.9a4.35 4.35 0 1 0 0 8.7 4.35 4.35 0 0 0 0-8.7ZM12 9.45a2.55 2.55 0 1 1 0 5.1 2.55 2.55 0 0 1 0-5.1Zm5.2-2.7a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Z"/>
          </svg>
      {% endcase %}
    </a>
  {% endfor %}
</nav>
{% endif %}
