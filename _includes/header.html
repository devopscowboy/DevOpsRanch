<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <picture class="brand-logo brand-logo-light">
        <source type="image/webp" srcset="{{ '/assets/img/logo-black-header.webp' | relative_url }} 1x, {{ '/assets/img/logo-black-header-2x.webp' | relative_url }} 2x">
        <img src="{{ '/assets/img/logo-black-header.png' | relative_url }}" srcset="{{ '/assets/img/logo-black-header.png' | relative_url }} 1x, {{ '/assets/img/logo-black-header-2x.png' | relative_url }} 2x" alt="DevOps Ranch" width="229" height="48">
      </picture>
      <picture class="brand-logo brand-logo-dark">
        <source type="image/webp" srcset="{{ '/assets/img/logo-white-gold-header.webp' | relative_url }} 1x, {{ '/assets/img/logo-white-gold-header-2x.webp' | relative_url }} 2x">
        <img src="{{ '/assets/img/logo-white-gold-header.png' | relative_url }}" srcset="{{ '/assets/img/logo-white-gold-header.png' | relative_url }} 1x, {{ '/assets/img/logo-white-gold-header-2x.png' | relative_url }} 2x" alt="DevOps Ranch" width="229" height="48">
      </picture>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/lessons/' | relative_url }}" {% if page.url == "/lessons/" or page.collection == "lessons" %}aria-current="page"{% endif %}>Lessons</a>
      <a href="{{ '/labs/' | relative_url }}" {% if page.url == "/labs/" or page.collection == "labs" %}aria-current="page"{% endif %}>Labs</a>
      <a href="{{ '/cheatsheets/' | relative_url }}" {% if page.url == "/cheatsheets/" or page.collection == "cheatsheets" %}aria-current="page"{% endif %}>Sheets</a>
    </nav>
    <form class="search-form" id="search-form" role="search">
      <label class="sr-only" for="site-search">Search lessons, labs, and cheat sheets</label>
      <input id="site-search" type="search" placeholder="Search lessons, labs, sheets" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-controls="search-results" aria-expanded="false" title="Search lessons, labs, and cheat sheets. Press / to focus.">
      <div id="search-results" class="search-results" role="listbox" hidden></div>
    </form>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Use light theme" aria-pressed="true">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M14.5 2.5a8.8 8.8 0 1 0 7 12.2A7.2 7.2 0 0 1 14.5 2.5z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M18.9 5.1l-1.6 1.6M6.7 17.3l-1.6 1.6"/>
      </svg>
    </button>
  </div>
</header>
<p id="search-status" class="sr-only" aria-live="polite"></p>
