title: DevOps Ranch
description: Cheat sheets and labs for working DevOps engineers.
tagline: Cheat sheets and labs for working DevOps engineers.
url: https://devopsranch.com
baseurl: ""
lang: en

# Footer and splash. Change a URL here and both places update.
social:
  - name: X
    icon: x
    url: https://x.com/devopsranch
  - name: YouTube
    icon: youtube
    url: https://www.youtube.com/channel/UCkKlPvYZSi13JRBS_sfCzgQ
  - name: Instagram
    icon: instagram
    url: https://www.instagram.com/devopsranch/

# GitHub Pages defaults to the Primer theme. Null keeps our layouts and CSS.
theme: null

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Every Markdown file in these folders becomes a page. Nothing else has to
# be edited to list a new sheet or note.
collections:
  cheatsheets:
    output: true
    # :path keeps git.md at /cheatsheets/git/ and a file at
    # _cheatsheets/linux/files-and-directories.md at
    # /cheatsheets/linux/files-and-directories/. A section landing
    # sets `section` and no `parent`. A topic sets `parent` and `order`.
    # The sheets list hides every page that has a parent.
    permalink: /cheatsheets/:path/
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: cheatsheets
    values:
      layout: cheatsheet
      tags: []
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      tags: []
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - templates
  - .bundle
  - node_modules
