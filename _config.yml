title: DevOps Ranch
description: Linux lessons, labs, and cheat sheets for the RHCSA.
tagline: Linux lessons, labs, and cheat sheets for the RHCSA.
url: https://devopsranch.com
baseurl: ""
lang: en

# Footer and splash. Change a URL here and both places update.
social:
  - name: X
    icon: x
    url: https://x.com/devopsranch
  - name: YouTube
    icon: youtube
    url: https://www.youtube.com/@devopsranch
  - name: Instagram
    icon: instagram
    url: https://www.instagram.com/devopsranch/

# GitHub Pages defaults to the Primer theme. Null keeps our layouts and CSS.
theme: null

# jekyll-sitemap is on the GitHub Pages whitelist. Listing it here makes
# the local build emit the same sitemap production does.
plugins:
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Every Markdown file in these folders becomes a page. Nothing else has to
# be edited to list a new sheet or note.
collections:
  cheatsheets:
    output: true
    # :path keeps a file at _cheatsheets/linux/files-and-directories.md
    # at /cheatsheets/linux/files-and-directories/. A section landing
    # sets `section` and no `parent`. A topic sets `parent` and `order`.
    # Lists sort by `order`, not by title. Linux is order 1.
    # published: false keeps the file in the repo and skips the page.
    permalink: /cheatsheets/:path/
  lessons:
    output: true
    permalink: /lessons/:path/
  labs:
    output: true
    permalink: /labs/:path/
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: cheatsheets
    values:
      layout: cheatsheet
      tags: []
  - scope:
      path: ""
      type: lessons
    values:
      layout: lesson
      tags: []
  - scope:
      path: ""
      type: labs
    values:
      layout: lab
      tags: []
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      tags: []
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - templates
  - .bundle
  - node_modules
